<!DOCTYPE html>
<html>
<head>
    <title>My projects page</title>
    <style>
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .project-card {
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px grey
         
        }

        @media (max-width: 600px) {
            .projects {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>
    <div class=" Projects">
        <div class="project-card">Python project</div>
        <div class="project-card">SQL project</div>
        <div class="project-card">AI project</div>
        <div class="project-card">Web project</div>
    </div>
</body>
</html>
